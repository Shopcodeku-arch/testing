<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 6px solid #1e293b;
            border-top: 6px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .text {
            font-size: 18px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div class="text">Tunggu sebentar ya...</div>

    <script>
        setTimeout(function() {
            window.location.href = "/id/beranda";
        }, 5000); // 5000ms = 5 detik
    </script>

</body>
</html>
